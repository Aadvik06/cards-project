<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Cards Project</title>
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div>
        <p class="eyebrow">Travel booking</p>
        <h1>Choose the best card</h1>
      </div>
      <div class="status-pill" id="saveStatus">Ready</div>
    </header>

    <main class="shell">
      <nav class="steps" aria-label="Booking steps">
        <div class="step is-active" data-step="1">
          <span>1</span>
          <strong>Trip type</strong>
        </div>
        <div class="step" data-step="2">
          <span>2</span>
          <strong>Prices</strong>
        </div>
        <div class="step" data-step="3">
          <span>3</span>
          <strong>Card choice</strong>
        </div>
        <div class="step" data-step="4">
          <span>4</span>
          <strong>Final amount</strong>
        </div>
      </nav>

      <section class="panel" id="stepTrip">
        <div class="section-head">
          <p class="eyebrow">Step 1</p>
          <h2>What are you booking?</h2>
        </div>

        <div class="choice-grid">
          <button class="choice-card" data-travel-type="flight" type="button">
            <span class="choice-icon">Flight</span>
            <strong>Flight</strong>
            <small>Compare flight vendors and card rewards.</small>
          </button>
          <button class="choice-card" data-travel-type="hotel" type="button">
            <span class="choice-icon">Hotel</span>
            <strong>Hotel</strong>
            <small>Compare hotel vendors and card rewards.</small>
          </button>
        </div>
      </section>

      <section class="panel is-hidden" id="stepPrices">
        <div class="section-head">
          <p class="eyebrow">Step 2</p>
          <h2 id="priceTitle">Enter prices</h2>
        </div>

        <form id="quoteForm">
          <div class="form-grid">
            <label>
              Employee ID
              <input id="employeeId" name="employeeId" autocomplete="off" placeholder="Optional" />
            </label>
            <label>
              Travel date
              <input id="travelDate" name="travelDate" type="date" />
            </label>
          </div>

          <div class="vendor-list" id="vendorList"></div>

          <div class="actions">
            <button class="secondary" id="backToTrip" type="button">Back</button>
            <button class="primary" type="submit">Show card ranking</button>
          </div>
        </form>
      </section>

      <section class="panel is-hidden" id="stepRecommendation">
        <div class="section-head">
          <p class="eyebrow">Step 3</p>
          <h2>Recommended card</h2>
        </div>

        <div id="bestOption"></div>
        <div class="rank-list" id="rankList"></div>

        <div class="decline-box is-hidden" id="declineBox">
          <label>
            Reason for choosing a different card
            <textarea id="declineReason" rows="3" placeholder="Example: employee preference, booking issue, vendor unavailable"></textarea>
          </label>
          <div class="actions">
            <button class="secondary" id="cancelDecline" type="button">Cancel</button>
            <button class="primary" id="confirmDecline" type="button">Continue</button>
          </div>
        </div>
      </section>

      <section class="panel is-hidden" id="stepFinalize">
        <div class="section-head">
          <p class="eyebrow">Step 4</p>
          <h2>Final checkout amount</h2>
        </div>

        <div class="summary-strip" id="selectedSummary"></div>

        <form id="finalForm">
          <div class="form-grid">
            <label>
              Final amount paid
              <input id="finalAmount" type="number" min="1" step="0.01" required />
            </label>
            <label>
              Paid at
              <input id="paidAt" type="datetime-local" />
            </label>
          </div>

          <div class="actions">
            <button class="primary" type="submit">Save transaction</button>
          </div>
        </form>
      </section>

      <section class="panel success-panel is-hidden" id="donePanel">
        <div class="section-head">
          <p class="eyebrow">Saved</p>
          <h2>Transaction logged</h2>
        </div>
        <div id="savedDetails"></div>
        <div class="actions">
          <button class="primary" id="startOver" type="button">Start another booking</button>
        </div>
      </section>
    </main>

    <div class="toast is-hidden" id="toast"></div>

    <script src="/static/app.js"></script>
  </body>
</html>
