services:
  - type: web
    name: precisehub
    env: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:create_app --factory --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: precisehub-db
          property: connectionString

databases:
  - name: precisehub-db
    databaseName: precisehub
    user: precisehub
