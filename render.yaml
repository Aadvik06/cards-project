services:
  - type: web
    name: precisehub
    runtime: python
    plan: starter
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:create_app --factory --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.5
      - key: DATABASE_URL
        fromDatabase:
          name: precisehub-db
          property: connectionString

databases:
  - name: precisehub-db
    plan: basic-256mb
    databaseName: precisehub
    user: precisehub
